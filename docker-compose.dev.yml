version: "3.9"
# usage:
# docker compose --env-file .env_dev -f docker-compose.dev.yml up -d
# docker-compose down
services:
  cll_genie_app_dev:
    container_name: ${CONTAINER_NAME:?Set CONTAINER_NAME}
    build:
      context: .
      dockerfile: Dockerfile.dev
      network: host
      target: cll_genie_app_dev
    image: cll_genie:${CLL_GENIE_VERSION:?Set CLL_GENIE_VERSION}-dev
    network_mode: bridge
    ports:
      - "${PORT_NBR:?Set PORT_NBR}:${PORT_NBR:?Set PORT_NBR}"
    environment:
      - CLL_GENIE_VERSION=${CLL_GENIE_VERSION:?Set CLL_GENIE_VERSION}-dev
      - PORT_NBR=${PORT_NBR:?Set PORT_NBR}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - FLASK_APP=wsgi.py
      - FLASK_DEBUG=1
      - SCRIPT_NAME=${SCRIPT_NAME?Set SCRIPT_NAME (may be empty)}
    env_file:
      - .env_dev
    restart: always
    volumes:
      - "./cll_genie:/cll_genie/cll_genie"
      - "./wsgi.py:/cll_genie/wsgi.py"
      - "./config.py:/cll_genie/config.py"
      - "./version.py:/cll_genie/version.py"
      - "${RESULTS_DIR:?Set RESULTS_DIR}:/cll_genie/results/"
      - "${LYMPHOTRACK_RESULTS_DIR:?Set LYMPHOTRACK_RESULTS_DIR}:${LYMPHOTRACK_RESULTS_DIR:?Set LYMPHOTRACK_RESULTS_DIR}:ro"
      - "${LOGS_DIR:?Set LOGS_DIR}:/cll_genie/logs"
    command: "python3 /cll_genie/wsgi.py"
