version: '3.9'
# usage:
# docker-compose up -d
# docker-compose down
services:
  cll_genie_app:
    container_name: ${CONTAINER_NAME:?Set CONTAINER_NAME}
    build:
      context: .
      network: host
      target: cll_genie_app
    image: cll_genie:${CLL_GENIE_VERSION:?Set CLL_GENIE_VERSION}
    network_mode: bridge
    ports:
      - "${PORT_NBR:?Set PORT_NBR}:${PORT_NBR:?Set PORT_NBR}"
    environment:
      - CLL_GENIE_VERSION=${CLL_GENIE_VERSION:?Set CLL_GENIE_VERSION}
      - PORT_NBR=${PORT_NBR:?Set PORT_NBR}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - FLASK_APP=wsgi.py
      - FLASK_DEBUG=0
      - SCRIPT_NAME=${SCRIPT_NAME?Set SCRIPT_NAME (may be empty)}
    env_file:
      - .env
    restart: always
    volumes:
      - "${RESULTS_DIR:?Set RESULTS_DIR}:/cll_genie/results/"
      - "${LYMPHOTRACK_RESULTS_DIR:?Set LYMPHOTRACK_RESULTS_DIR}:${LYMPHOTRACK_RESULTS_DIR:?Set LYMPHOTRACK_RESULTS_DIR}:ro"
      - "${LOGS_DIR:?Set LOGS_DIR}:/cll_genie/logs"
