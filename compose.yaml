services:
  proxy:
    container_name: cll-genie-proxy
    cpus: "${PROXY_CPU_LIMIT:?PROXY_CPU_LIMIT must be set in the environment file}"
    mem_limit: "${PROXY_MEMORY_LIMIT:?PROXY_MEMORY_LIMIT must be set in the environment file}"
    build:
      context: .
      dockerfile: docker/proxy.Dockerfile
      network: host
    ports:
      - "${CLL_GENIE_PORT:?CLL_GENIE_PORT must be set in .env}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [cll_genie]
    restart: unless-stopped

  api:
    container_name: cll-genie-api
    cpus: "${API_CPU_LIMIT:?API_CPU_LIMIT must be set in the environment file}"
    mem_limit: "${API_MEMORY_LIMIT:?API_MEMORY_LIMIT must be set in the environment file}"
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      network: host
    env_file:
      - .env
    environment:
      LOG_SERVICE_NAME: api
    command:
      [
        "sh",
        "-c",
        "python -m cll_genie_api.scripts.ensure_indexes && exec uvicorn cll_genie_api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*",
      ]
    depends_on:
      redis:
        condition: service_healthy
    expose: ["8000"]
    volumes:
      - "${LOG_ROOT:?LOG_ROOT must be set in .env}:${LOG_ROOT:?LOG_ROOT must be set in .env}"
      - "${ARTIFACT_ROOT:?ARTIFACT_ROOT must be set in .env}:${ARTIFACT_ROOT:?ARTIFACT_ROOT must be set in .env}"
      - "${LYMPHOTRACK_RESULTS_ROOT:?LYMPHOTRACK_RESULTS_ROOT must be set in .env}:${LYMPHOTRACK_RESULTS_ROOT:?LYMPHOTRACK_RESULTS_ROOT must be set in .env}:ro"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/cll_genie/health/live')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [cll_genie]
    restart: unless-stopped

  worker:
    container_name: cll-genie-worker
    cpus: "${WORKER_CPU_LIMIT:?WORKER_CPU_LIMIT must be set in the environment file}"
    mem_limit: "${WORKER_MEMORY_LIMIT:?WORKER_MEMORY_LIMIT must be set in the environment file}"
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      network: host
    command:
      [
        "celery",
        "-A",
        "cll_genie_api.worker.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
      ]
    env_file:
      - .env
    environment:
      LOG_SERVICE_NAME: worker
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - "${LOG_ROOT:?LOG_ROOT must be set in .env}:${LOG_ROOT:?LOG_ROOT must be set in .env}"
      - "${ARTIFACT_ROOT:?ARTIFACT_ROOT must be set in .env}:${ARTIFACT_ROOT:?ARTIFACT_ROOT must be set in .env}"
      - "${RUN_ROOT:?RUN_ROOT must be set in .env}:${RUN_ROOT:?RUN_ROOT must be set in .env}"
      - "${LYMPHOTRACK_RESULTS_ROOT:?LYMPHOTRACK_RESULTS_ROOT must be set in .env}:${LYMPHOTRACK_RESULTS_ROOT:?LYMPHOTRACK_RESULTS_ROOT must be set in .env}:ro"
    networks: [cll_genie]
    restart: unless-stopped

  scheduler:
    container_name: cll-genie-scheduler
    cpus: "${SCHEDULER_CPU_LIMIT:?SCHEDULER_CPU_LIMIT must be set in the environment file}"
    mem_limit: "${SCHEDULER_MEMORY_LIMIT:?SCHEDULER_MEMORY_LIMIT must be set in the environment file}"
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      network: host
    command:
      [
        "celery",
        "-A",
        "cll_genie_api.worker.celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    env_file:
      - .env
    environment:
      LOG_SERVICE_NAME: scheduler
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - "${LOG_ROOT:?LOG_ROOT must be set in .env}:${LOG_ROOT:?LOG_ROOT must be set in .env}"
    networks: [cll_genie]
    restart: unless-stopped

  redis:
    container_name: cll-genie-redis
    cpus: "${REDIS_CPU_LIMIT:?REDIS_CPU_LIMIT must be set in the environment file}"
    mem_limit: "${REDIS_MEMORY_LIMIT:?REDIS_MEMORY_LIMIT must be set in the environment file}"
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [cll_genie]
    restart: unless-stopped

  mongo:
    container_name: cll-genie-mongo
    cpus: "${MONGO_CPU_LIMIT:?MONGO_CPU_LIMIT must be set in the environment file}"
    mem_limit: "${MONGO_MEMORY_LIMIT:?MONGO_MEMORY_LIMIT must be set in the environment file}"
    image: mongo:3.4
    platform: linux/amd64
    profiles: ["mongo"]
    command: ["mongod", "--bind_ip", "0.0.0.0"]
    ports:
      - "${MONGO_DEV_PORT:?MONGO_DEV_PORT must be set in .env}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongo",
          "--quiet",
          "--eval",
          "quit(db.runCommand({ping:1}).ok ? 0 : 2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [cll_genie]
    restart: unless-stopped

networks:
  cll_genie:
    external: true
    name: cll_genie-net

volumes:
  redis_data: {}
  mongo_data: {}
