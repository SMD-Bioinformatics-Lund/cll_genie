server {
    listen 80;
    server_name _;

    client_max_body_size 200M;

    # ------------------------------------------------------------
    # Dev app root
    # ------------------------------------------------------------

    location = / {
        return 302 /cll_genie_dev/;
    }

    location = /cll_genie_dev {
        return 302 /cll_genie_dev/;
    }

    # ------------------------------------------------------------
    # Everything under /cll_genie_dev/ goes to Vite.
    #
    # Vite itself proxies:
    #   /cll_genie_dev/api/...    -> FastAPI
    #   /cll_genie_dev/health/... -> FastAPI
    #
    # No trailing slash after frontend:5173.
    # This preserves the original URI.
    # ------------------------------------------------------------

    location /cll_genie_dev/ {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;

        proxy_set_header Host localhost:5173;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;
    }
}