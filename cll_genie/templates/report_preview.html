<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report preview — {{ sample_name }}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; font: 14px system-ui, sans-serif; color: #292524; background: #f5f5f4; }
    .preview-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; background: #fff; border-bottom: 1px solid #ddd6d3; }
    h1 { margin: 0 0 4px; font-size: 16px; }
    p { margin: 0; font-size: 12px; color: #57534e; }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    button, a { display: inline-block; padding: 8px 12px; border: 1px solid #d6d3d1; border-radius: 5px; background: #fff; font: inherit; text-decoration: none; color: inherit; cursor: pointer; }
    button { background: #9a4e24; border-color: #9a4e24; color: #fff; }
    button:focus-visible, a:focus-visible { outline: 2px solid #9a4e24; outline-offset: 3px; }
    iframe { flex: 1; min-height: 0; width: 100%; border: 0; }
  </style>
  <script src="{{ url_for('static', filename='js/report-preview.js') }}" defer></script>
</head>
<body>
  <section class="preview-actions" aria-label="Report preview actions">
    <div>
      <h1>Report preview — {{ sample_name }}</h1>
      <p>Downloading does not finalize the report.</p>
    </div>
    <div class="buttons">
      <a href="{{ sample_url }}">Back to sample</a>
      <button id="download-report" type="button" data-filename="{{ download_filename }}">Download HTML</button>
    </div>
  </section>
  <iframe id="report-preview" title="Report preview for {{ sample_name }}" srcdoc="{{ report_html }}" sandbox=""></iframe>
</body>
</html>
